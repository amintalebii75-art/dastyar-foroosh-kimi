<style>

.cell-user { display:flex;align-items:center;gap:12px; }

.badge-danger { background:var(--danger-light);color:#991b1b; }
.badge-danger::before { background:var(--danger); }
.badge-primary { background:#e0f2fe;color:#075985; }

.price { font-weight:700;color:var(--primary);font-feature-settings:'tnum'; }

.product-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all 0.2s ease;position:relative; }

.cat-option:hover { border-color:var(--text-muted); }
.cat-option.selected { border-color:var(--accent);background:#f0f9ff;color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,0.08); }
.toast-container { position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none; }
.toast { background:var(--primary);color:white;padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;transform:translateY(20px);opacity:0;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);pointer-events:auto; }

.hidden { display:none !important; }

  if (str == null) return '';

function showToast(msg, type) {
  const c = document.getElementById('toast-container');

  t.className = 'toast ' + (type || '');
  t.innerHTML = '<span>' + escapeHtml(msg) + '</span>';
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3000);
}

      <div class="chart-tooltip">${fmtPrice(sales[i] * 1000000)}</div>
      <div class="chart-bar-bg">
        <div class="chart-bar-fill secondary" style="height:${h2}px;width:50%;left:0;right:auto;border-radius:6px 0 0 0"></div>
        <div class="chart-bar-fill" style="height:${h1}px;width:50%;left:auto;right:0;border-radius:0 6px 0 0"></div>

  const tbody = document.getElementById('recent-orders');

    <td style="font-weight:700;color:var(--primary)">#${toFa(o.id)}</td>

}

function saveCustomer(e) {

  const cat = document.querySelector('#customer-form .cat-option.selected').dataset.cat;

  const newCustId = customers.length ? Math.max(...customers.map(x => x.id)) + 1 : 1;
  customers.unshift({
    id: newCustId, name, company, phone: toEn(phone),
    whatsapp: toEn(document.getElementById('c-whatsapp').value),
    address: document.getElementById('c-address').value,
    category: cat, lastVisit: 'امروز',
    interests: document.getElementById('c-interests').value,
    notes: document.getElementById('c-notes').value
  });

  closeModal('customer-modal');
  document.getElementById('customer-form').reset();

              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

function openOrderModal() {
  cart = [];
  document.getElementById('order-modal').classList.add('active');
  setTimeout(() => document.getElementById('order-modal').classList.add('show'), 10);
  const select = document.getElementById('o-customer');
  select.innerHTML = '<option value="">-- مشتری را انتخاب کنید --</option>' + Store.get('customers').map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${toFa(escapeHtml(c.phone))})</option>`).join('');
  renderOrderProducts();
  updateCart();
}

function selectPrice(el) {
  el.parentElement.querySelectorAll('.cat-option').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedPriceLevel = parseInt(el.dataset.price);
  renderOrderProducts();
}

function renderOrderProducts() {
  const grid = document.getElementById('order-products');
  grid.innerHTML = Store.get('products').map(p => {
    const price = selectedPriceLevel === 1 ? p.price1 : selectedPriceLevel === 2 ? p.price2 : p.price3;
    const inCart = cart.find(i => i.id === p.id);
    return `<div class="product-card ${inCart ? 'selected' : ''}" onclick="addToCart(${p.id})">
      <div class="product-img">
        <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--accent);opacity:0.4"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      </div>
      <div class="product-name">${p.name}</div>
      <div class="product-sku">${p.sku}</div>
      <div class="product-footer">
        <div class="product-price">${fmtPrice(price)}</div>
        <div class="product-unit">${p.unit}</div>
      </div>
      ${inCart ? `<div style="margin-top:10px;text-align:center;background:var(--accent);color:white;padding:5px 0;border-radius:6px;font-size:12px;font-weight:600;">در سبد: ${toFa(inCart.qty)}</div>` : ''}
    </div>`;
  }).join('');
}

function addToCart(productId) {
  const product = Store.get('products').find(p => p.id === productId);
  const price = selectedPriceLevel === 1 ? product.price1 : selectedPriceLevel === 2 ? product.price2 : product.price3;
  const existing = cart.find(i => i.id === productId);
  if (existing) { existing.qty += 1; existing.total = existing.qty * price; }
  else { cart.push({ id: productId, name: product.name, unit: product.unit, qty: 1, price, total: price }); }
  renderOrderProducts();
  updateCart();
}

function updateCart() {
  const container = document.getElementById('cart-items');
  if (cart.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:30px 0;"><p style="color:var(--text-muted);font-size:13px;">سبد خرید خالی است</p></div>';
  } else {
    container.innerHTML = cart.map((item, idx) => `<div class="cart-item">
      <div class="cart-item-info"><div class="name">${escapeHtml(item.name)}</div><div class="price">${fmtPrice(item.price)} × ${toFa(item.qty)} ${escapeHtml(item.unit)}</div></div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
        <div class="qty-value">${toFa(item.qty)}</div>
        <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
      </div>
    </div>`).join('');
  }
  const subtotal = cart.reduce((s, i) => s + i.total, 0);
  const tax = Math.round(subtotal * 0.09);
  document.getElementById('cart-subtotal').textContent = fmtPrice(subtotal);
  document.getElementById('cart-tax').textContent = fmtPrice(tax);
  document.getElementById('cart-total').textContent = fmtPrice(subtotal + tax);
}

function changeQty(idx, delta) {
  const item = cart[idx];
  const product = Store.get('products').find(p => p.id === item.id);
  const price = selectedPriceLevel === 1 ? product.price1 : selectedPriceLevel === 2 ? product.price2 : product.price3;
  item.qty += delta;
  if (item.qty <= 0) cart.splice(idx, 1);
  else item.total = item.qty * price;
  renderOrderProducts();
  updateCart();
}

function saveOrder() {
  const customerId = document.getElementById('o-customer').value;
  if (!customerId) { showToast('لطفاً مشتری را انتخاب کنید', 'error'); return; }
  if (cart.length === 0) { showToast('سبد خرید خالی است', 'error'); return; }
  const customer = Store.get('customers').find(c => c.id == customerId);
  const subtotal = cart.reduce((s, i) => s + i.total, 0);
  const tax = Math.round(subtotal * 0.09);
  const orders = Store.get('orders');
  const newOrderId = orders.length ? Math.max(...orders.map(x => x.id)) + 1 : 1001;
  orders.unshift({
    id: newOrderId,
    customerId: customer.id,
    customerName: customer.name,
    date: new Date().toLocaleDateString('fa-IR'),
    items: cart.reduce((s, i) => s + i.qty, 0),
    amount: subtotal,
    tax: tax,
    total: subtotal + tax,
    status: 'پیش‌نویس'
  });
  Store.set('orders', orders);
  closeModal('order-modal');
  cart = [];
  showToast('سفارش با موفقیت ثبت شد', 'success');
  if (currentPage === 'orders') renderOrdersTable();
  if (currentPage === 'dashboard') renderPage('dashboard');
}

function exportData() {
  const data = { customers: Store.get('customers'), products: Store.get('products'), orders: Store.get('orders'), exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dastyar-foroosh-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('فایل پشتیبان دانلود شد', 'success');
}

// Init
renderPage('dashboard');
</script>
